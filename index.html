<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BY DESIGN</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f1e7;color:#171713;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:430px;margin:auto;min-height:100vh;padding:54px 24px}.brand{letter-spacing:4px;font-size:12px;color:#9c8352}
h1{font:500 40px Georgia,serif;margin:18px 0 8px}p{color:#746f66;line-height:1.5}
.card{background:white;padding:20px;border-radius:22px;margin:20px 0}input{width:100%;padding:14px;border:1px solid #ddd4c5;border-radius:13px;margin:7px 0;font-size:16px}
button{width:100%;border:0;border-radius:13px;padding:14px;background:#171713;color:white;font-weight:700;margin-top:8px}
.alt{background:#e9dfca;color:#171713}#app{display:none}.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat div{background:white;border-radius:18px;padding:16px}small{color:#8b857b}b{display:block;font-size:23px;margin-top:8px}
.msg{font-size:13px;margin-top:12px}.lead{border-top:1px solid #eee7da;padding:12px 0}select,textarea{width:100%;padding:13px;border:1px solid #ddd4c5;border-radius:13px;margin:7px 0;background:white}
</style></head><body><div class="wrap">
<div class="brand">BY DESIGN</div>
<section id="auth"><h1>Welcome.</h1><p>Build the business. Design the life.</p>
<div class="card"><input id="name" placeholder="Full name"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (6+ characters)">
<button onclick="signup()">Create account</button><button class="alt" onclick="signin()">Sign in</button><div class="msg" id="authmsg"></div></div></section>
<section id="app"><h1 id="hello">Good morning.</h1><p>Your real BY DESIGN member dashboard.</p>
<div class="stat"><div><small>CONTACTS</small><b id="count">0</b></div><div><small>FOLLOW-UPS</small><b id="follows">0</b></div></div>
<div class="card"><small>QUICK ADD</small><h3>Add a lead</h3><input id="leadname" placeholder="Name"><input id="leademail" placeholder="Email"><input id="leadphone" placeholder="Phone"><input id="instagram" placeholder="Instagram">
<select id="status"><option>New</option><option>Talking</option><option>Follow-up</option><option>Ready</option><option>Customer</option><option>Partner</option></select>
<input id="follow" type="date"><textarea id="notes" placeholder="Notes"></textarea><button onclick="addLead()">Save lead</button><div class="msg" id="leadmsg"></div></div>
<div class="card"><small>MY CONTACTS</small><div id="list">No contacts yet.</div></div>
<button class="alt" onclick="signout()">Sign out</button></section></div>
<script>
const sb=supabase.createClient('https://nifddqioguuvabooqolp.supabase.co','sb_publishable_zpdR5YDEczM2AqwGMbAunw_xR0ypUKP');
async function init(){let {data:{session}}=await sb.auth.getSession(); if(session) showApp(session.user);}
async function signup(){authmsg.textContent='Creating account...';let e=email.value.trim(),p=password.value,n=name.value.trim();let {data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{full_name:n}}});authmsg.textContent=error?error.message:(data.session?'Account created!':'Check your email to confirm your account, then come back and sign in.');if(data.session)showApp(data.user)}
async function signin(){authmsg.textContent='Signing in...';let {data,error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});authmsg.textContent=error?error.message:'';if(data.user)showApp(data.user)}
async function showApp(user){auth.style.display='none';app.style.display='block';hello.textContent='Good morning'+(user.user_metadata?.full_name?', '+user.user_metadata.full_name.split(' ')[0]:'')+'.';await loadLeads()}
async function loadLeads(){let {data,error}=await sb.from('contacts').select('*').order('created_at',{ascending:false});if(error){list.textContent=error.message;return}count.textContent=data.length;follows.textContent=data.filter(x=>x.status==='Follow-up').length;list.innerHTML=data.length?data.map(x=>`<div class="lead"><b style="font-size:16px">${x.name}</b><small>${x.status}${x.next_follow_up?' · follow '+x.next_follow_up:''}</small></div>`).join(''):'No contacts yet.'}
async function addLead(){let {data:{user}}=await sb.auth.getUser();if(!user)return;let {error}=await sb.from('contacts').insert({user_id:user.id,name:leadname.value.trim(),email:leademail.value.trim()||null,phone:leadphone.value.trim()||null,instagram:instagram.value.trim()||null,status:status.value,next_follow_up:follow.value||null,notes:notes.value||null});leadmsg.textContent=error?error.message:'Lead saved.';if(!error){leadname.value=leademail.value=leadphone.value=instagram.value=follow.value=notes.value='';await loadLeads()}}
async function signout(){await sb.auth.signOut();location.reload()}init();
</script></body></html>
